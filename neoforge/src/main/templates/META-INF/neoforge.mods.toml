modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="rats_logo.png"
authors="${mod_authors}"
credits="${mod_credits}"
enumExtensions="META-INF/enumextensions.json"
description='''
${mod_description}
'''

[[mixins]]
config="${mod_id}.mixins.json"
# the original's own mixins (piglins and the idol upgrade, wardens and the sculked upgrade), shared with Fabric
[[mixins]]
config="${mod_id}.common.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="rampart"
    type="required"
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"
