plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI
    mavenLocal() { content { includeGroup 'dev.vladeezyy.rampart' } } // Rampart: ./gradlew publishToMavenLocal there
}

// Tests: the shared checks (common/src/selftest) and the Fabric wiring (src/selftest), a second mod in dev runs only
sourceSets {
    selftest {
        java.srcDir rootProject.file('common/src/selftest/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "dev.vladeezyy.rampart:rampart-fabric:${rampart_version}"
    // JEI common API (Mojang names, compile only; its Fabric jar is built with a newer Loom)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
}

loom {
    accessWidenerPath = file('src/main/resources/rats.accesswidener')
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        rats_selftest {
            sourceSet sourceSets.selftest
        }
    }
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        // tools/selftest.sh LOADER=fabric
        selftest {
            server()
            name 'Self Test'
            source sourceSets.selftest
            vmArg '-Drats.selftest=true'
            vmArg "-Drats.selftest.only=${project.findProperty('only') ?: ''}"
            runDir('run')
        }
        // tools/scenetest.sh LOADER=fabric
        scene {
            client()
            name 'Scene'
            source sourceSets.selftest
            vmArg "-Drats.scene=${project.findProperty('scene') ?: 'main'}"
            vmArg "-Drats.scene.lang=${project.findProperty('scene_lang') ?: 'en_us'}"
            runDir('run')
        }
        // tools/nettest.sh LOADER=fabric
        netServer {
            server()
            name 'Net Server'
            source sourceSets.selftest
            runDir('run-net')
        }
        netClient {
            client()
            name 'Net Client'
            source sourceSets.selftest
            vmArg '-Drats.scene=net'
            // the test server makes "Dev" an operator (NeoForge dev clients are "Dev" already)
            programArgs '--quickPlayMultiplayer', 'localhost:25565', '--username', 'Dev'
            runDir('run')
        }
    }
}

// The release jar on a production (intermediary-mapped) Fabric server with Fabric API: prodtest/serve-fabric.sh
configurations {
    productionMods { transitive = false }
    productionRampart { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionRampart "dev.vladeezyy.rampart:rampart-fabric:${rampart_version}"
}

// the built-in Ratlantis datapack: NeoForge reads data/minecraft/datapacks/ratlantis, Fabric's built-in packs live in resourcepacks/
processResources {
    from(rootProject.file('common/src/generated/resources/data/minecraft/datapacks/ratlantis')) { into 'resourcepacks/ratlantis' }
}
def prodDir = file('run-prod')
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn jar
    mods.from(jar.archiveFile)
    mods.from(configurations.productionMods)
    mods.from(configurations.productionRampart)
    runDir = prodDir
    timeout = java.time.Duration.ofMinutes(5)
    doFirst {
        new File(prodDir, 'world').deleteDir()
        new File(prodDir, 'config').deleteDir()
        prodDir.mkdirs()
        new File(prodDir, 'eula.txt').text = 'eula=true\n'
    }
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }
