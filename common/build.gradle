plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // the same access transformer as NeoForge (Fabric: the matching access widener)
    accessTransformers.from(rootProject.file('neoforge/src/main/resources/META-INF/accesstransformer.cfg'))
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven { url = 'https://maven.fabricmc.net' }
}

repositories {
    maven { url = 'https://maven.blamejared.com/' } // JEI
    mavenLocal() { content { includeGroup 'dev.vladeezyy.rampart' } } // Rampart: ./gradlew publishToMavenLocal there
}

dependencies {
    // mixins live in common, both loaders ship Mixin at runtime
    compileOnly 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
    compileOnly "dev.vladeezyy.rampart:rampart-common:${rampart_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources file('src/main/resources')
    commonResources file('src/generated/resources')
}
